name: Deploy the website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - name: Reuse downloaded stock photos
        uses: actions/cache@v6
        with:
          path: .cache/images
          key: images-${{ hashFiles('data/images.json', 'scripts/images.mjs', 'photos/**') }}
          restore-keys: images-

      # Encoding every width in AVIF and WebP takes a while (200+ photos), so the resized files are kept
      # too. The fallback key is safe: scripts/images.mjs stamps each slot with its photo's content hash
      # and the encoder settings (kept in .cache/images, above), and makes again only what changed.
      - name: Reuse resized photos
        uses: actions/cache@v6
        with:
          path: public/img
          key: resized-${{ hashFiles('data/images.json', 'scripts/images.mjs', 'photos/**') }}
          restore-keys: resized-

      - run: npm ci

      - name: Build the static export
        run: npm run build
        env:
          # The address Pages serves the site at: the custom domain once it's set in Settings → Pages
          # (www.escape-away.com), <account>.github.io before or without one. Canonicals, the sitemap and
          # share links follow it, so connecting or removing the domain only needs a new deploy.
          # A user site needs no basePath.
          NEXT_PUBLIC_SITE_URL: https://${{ steps.pages.outputs.host || format('{0}.github.io', github.repository_owner) }}
          NEXT_PUBLIC_NOINDEX: 'false'
          NEXT_PUBLIC_WHATSAPP: ${{ vars.WHATSAPP_NUMBER }}
          NEXT_PUBLIC_OWNER_WHATSAPP: ${{ vars.OWNER_WHATSAPP_NUMBER }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ vars.MAPBOX_TOKEN }}
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
          NEXT_PUBLIC_GBP_URL: ${{ vars.GBP_URL }}

      - name: Check Arabic search and both message files
        run: npm run test:arabic

      - name: Check the forms' sheet script
        run: npm run test:forms

      - name: Check every page in both languages
        run: npm run check:export
        env:
          NEXT_PUBLIC_NOINDEX: 'false'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
